navigationCompose = "2.8.5"
room = "2.8.4"
work = "2.10.0"
datastore = "1.1.7"
ktor = "3.0.3"
kotlinxSerialization = "1.9.0"
coil = "3.1.0"
exifinterface = "1.4.2"
splashscreen = "1.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
